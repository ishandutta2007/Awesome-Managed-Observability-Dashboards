<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="metricGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: url(#titleGrad);
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 18px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .grid-line {
      stroke: #334155;
      stroke-opacity: 0.25;
      stroke-width: 1;
    }
    .pulse-dot {
      animation: pulse 2.5s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.4); opacity: 0.3; }
    }
    .dash-line {
      stroke-dasharray: 6, 6;
      animation: dash 25s linear infinite;
    }
    @keyframes dash {
      to { stroke-dashoffset: -1000; }
    }
    .wave-line {
      stroke-dasharray: 1200;
      stroke-dashoffset: 1200;
      animation: drawWave 5s ease-out forwards;
    }
    @keyframes drawWave {
      to { stroke-dashoffset: 0; }
    }
  </style>

  <!-- Deep Cosmic Background -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="340" rx="16" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Background Animated / Dynamic Grid & Waves -->
  <g opacity="0.4">
    <line x1="0" y1="68" x2="1200" y2="68" class="grid-line" />
    <line x1="0" y1="136" x2="1200" y2="136" class="grid-line" />
    <line x1="0" y1="204" x2="1200" y2="204" class="grid-line" />
    <line x1="0" y1="272" x2="1200" y2="272" class="grid-line" />
    <line x1="240" y1="0" x2="240" y2="340" class="grid-line" />
    <line x1="480" y1="0" x2="480" y2="340" class="grid-line" />
    <line x1="720" y1="0" x2="720" y2="340" class="grid-line" />
    <line x1="960" y1="0" x2="960" y2="340" class="grid-line" />
  </g>

  <!-- Dynamic Waveform at Bottom / Background Layer -->
  <path d="M 0 290 Q 150 250 300 280 T 600 270 T 900 295 T 1200 260 L 1200 340 L 0 340 Z" fill="url(#accentGrad)" opacity="0.08" />
  
  <path d="M 0 290 Q 150 250 300 280 T 600 270 T 900 295 T 1200 260" 
        fill="none" 
        stroke="url(#metricGrad)" 
        stroke-width="3" 
        opacity="0.5" 
        class="wave-line" />

  <!-- Animated Telemetry Flow Particles (in background) -->
  <circle cx="210" cy="275" r="4" fill="#38bdf8" filter="url(#softGlow)" class="pulse-dot">
    <animate attributeName="cy" values="275;265;275" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="610" cy="270" r="5" fill="#818cf8" filter="url(#softGlow)" class="pulse-dot">
    <animate attributeName="cy" values="270;260;270" dur="2.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="950" cy="285" r="4" fill="#c084fc" filter="url(#softGlow)" class="pulse-dot">
    <animate attributeName="cy" values="285;272;285" dur="4s" repeatCount="indefinite" />
  </circle>

  <!-- FOREGROUND: Main Title and Headers (Guaranteed on Top) -->
  <g transform="translate(60, 82)">
    <!-- Category Pill -->
    <g transform="translate(0, 0)">
      <rect width="260" height="28" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" stroke-opacity="0.8" />
      <circle cx="14" cy="14" r="5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="28" y="19" class="badge-text" fill="#38bdf8" font-size="12">TELEMETRY &amp; DASHBOARDS 2026</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="68" class="title">Awesome Managed Observability</text>
    
    <!-- Subtitle -->
    <text x="0" y="104" class="subtitle">The Curated Matrix of SaaS Platforms &amp; Open-Source Dashboards</text>
    
    <!-- Badges / Feature Pills in Foreground -->
    <g transform="translate(0, 134)">
      <!-- Pill 1: Metrics -->
      <g transform="translate(0, 0)">
        <rect width="130" height="32" rx="16" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
        <text x="65" y="21" class="badge-text" text-anchor="middle">📊 Metrics (PromQL)</text>
      </g>
      <!-- Pill 2: Logs -->
      <g transform="translate(142, 0)">
        <rect width="115" height="32" rx="16" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.6" />
        <text x="57" y="21" class="badge-text" text-anchor="middle">📜 Log Streams</text>
      </g>
      <!-- Pill 3: Traces -->
      <g transform="translate(269, 0)">
        <rect width="135" height="32" rx="16" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1" stroke-opacity="0.6" />
        <text x="67" y="21" class="badge-text" text-anchor="middle">🔍 Distributed Tracing</text>
      </g>
      <!-- Pill 4: OpenTelemetry -->
      <g transform="translate(416, 0)">
        <rect width="150" height="32" rx="16" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1" stroke-opacity="0.6" />
        <text x="75" y="21" class="badge-text" text-anchor="middle">⚡ OpenTelemetry &amp; eBPF</text>
      </g>
    </g>
  </g>

  <!-- Right Decorative Telemetry Status Card (Foreground element) -->
  <g transform="translate(900, 55)">
    <rect width="240" height="190" rx="12" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="32" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#94a3b8">CLUSTER HEALTH</text>
    <rect x="175" y="20" width="45" height="16" rx="8" fill="#065f46" />
    <text x="197" y="32" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">LIVE</text>
    
    <!-- Mini Histogram Chart -->
    <g transform="translate(20, 52)">
      <rect x="0" y="45" width="16" height="35" rx="3" fill="#38bdf8" opacity="0.85">
        <animate attributeName="height" values="35;48;35" dur="3s" repeatCount="indefinite" />
        <animate attributeName="y" values="45;32;45" dur="3s" repeatCount="indefinite" />
      </rect>
      <rect x="24" y="25" width="16" height="55" rx="3" fill="#38bdf8" opacity="0.85">
        <animate attributeName="height" values="55;38;55" dur="3.5s" repeatCount="indefinite" />
        <animate attributeName="y" values="25;42;25" dur="3.5s" repeatCount="indefinite" />
      </rect>
      <rect x="48" y="15" width="16" height="65" rx="3" fill="#818cf8" opacity="0.85">
        <animate attributeName="height" values="65;72;65" dur="2.8s" repeatCount="indefinite" />
        <animate attributeName="y" values="15;8;15" dur="2.8s" repeatCount="indefinite" />
      </rect>
      <rect x="72" y="35" width="16" height="45" rx="3" fill="#818cf8" opacity="0.85" />
      <rect x="96" y="20" width="16" height="60" rx="3" fill="#c084fc" opacity="0.85">
        <animate attributeName="height" values="60;45;60" dur="4s" repeatCount="indefinite" />
        <animate attributeName="y" values="20;35;20" dur="4s" repeatCount="indefinite" />
      </rect>
      <rect x="120" y="10" width="16" height="70" rx="3" fill="#c084fc" opacity="0.85" />
      <rect x="144" y="30" width="16" height="50" rx="3" fill="#34d399" opacity="0.85" />
      <rect x="168" y="18" width="16" height="62" rx="3" fill="#34d399" opacity="0.85">
        <animate attributeName="height" values="62;74;62" dur="3.2s" repeatCount="indefinite" />
        <animate attributeName="y" values="18;6;18" dur="3.2s" repeatCount="indefinite" />
      </rect>
    </g>

    <!-- Key Metrics in Card -->
    <line x1="20" y1="145" x2="220" y2="145" stroke="#1e293b" stroke-width="1.2" />
    <text x="20" y="168" font-family="-apple-system, sans-serif" font-size="11" fill="#64748b">Ingest Rate</text>
    <text x="220" y="168" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="end">4.82 M eps</text>
  </g>
</svg>
